<!DOCTYPE html>
<html>
<head>
    <title>Financial Stress Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1c92d2);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        @keyframes gradient {
            0% { background-position: 0% }
            50% { background-position: 100% }
            100% { background-position: 0% }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: 0.3s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 500;
        }

        label {
            font-size: 13px;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus {
            box-shadow: 0 0 10px #00f5d4;
        }

        button {
            width: 100%;
            padding: 13px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(90deg, #00f5d4, #00c6ff);
            color: black;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            box-shadow: 0 0 25px #00f5d4;
            transform: translateY(-2px);
        }

        .result {
            margin-top: 30px;
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .score {
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .low { color: #00ff99; }
        .moderate { color: #ffcc00; }
        .high { color: #ff4d4d; }

        .progress {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff99, #ffcc00, #ff4d4d);
            width: {{ score if score else 0 }}%;
            transition: width 1s ease;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
            background: rgba(255,255,255,0.2);
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.6;
        }

    </style>
</head>

<body>

<div class="card">

    <h2>Financial Stress Analyzer</h2>

    <form method="POST" action="/calculate">

        <label>Monthly Income (₹)</label>
        <input type="number" name="income" required>

        <label>Monthly Expenses (₹)</label>
        <input type="number" name="expenses" required>

        <label>Total EMI (₹)</label>
        <input type="number" name="emi" required>

        <label>Current Savings (₹)</label>
        <input type="number" name="savings" required>

        <button type="submit">Analyze Stress</button>

    </form>

    {% if score %}
    <div class="result">

        <div class="score">{{ score }}/100</div>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

        {% if risk == "Low Risk" %}
            <div class="low">Low Financial Stress</div>
        {% elif risk == "Moderate Risk" %}
            <div class="moderate">Moderate Financial Stress</div>
        {% else %}
            <div class="high">High Financial Stress</div>
        {% endif %}

        <div class="badge">
            {{ model_used }}
        </div>

        <div class="footer">
            Powered by Machine Learning
        </div>

    </div>
    {% endif %}

</div>

</body>
</html>
